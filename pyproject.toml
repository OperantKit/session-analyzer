[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "session-analyzer"
dynamic = ["version"]
description = "Cumulative-record visualization, statistical analysis, and behavioral model fitting for OperantKit session logs."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "OperantKit contributors" },
]
keywords = [
  "behavior-analysis",
  "operant-conditioning",
  "cumulative-record",
  "matching-law",
  "bout-analysis",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "session-recorder>=0.1.1,<0.2",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "scipy>=1.11",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pytest-cov",
  "hypothesis>=6",
]
dev = [
  "session-analyzer[test]",
  "mypy>=1.10",
  "ruff>=0.5",
]

[project.scripts]
session-analyzer = "session_analyzer.cli:main"

[project.urls]
Homepage = "https://github.com/OperantKit"
Repository = "https://github.com/OperantKit/session-analyzer"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/session_analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--strict-markers",
  "--strict-config",
  "-ra",
]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "unit: pure unit tests with no external dependencies",
  "integration: tests that exercise cross-module interactions",
  "reference(module, verdict, source): the test that pins an analytics module to its source; see tests/test_reference_value_coverage.py",
]

[tool.coverage.run]
branch = true
source = ["session_analyzer"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RET"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*"]
ignore_missing_imports = true
